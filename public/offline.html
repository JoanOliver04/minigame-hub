<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1220"><title>Mini-Game Hub</title>
<style>
html{color-scheme:dark;background:#0f1220;color:#eef1ff;font:1rem/1.5 system-ui}body{margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:30rem;padding:2rem}h1{line-height:1.1}button{font:inherit;background:#ffe095;color:#222034;border:0;padding:.75rem 1.25rem;border-radius:.55rem;cursor:pointer}
</style></head><body><main><p>Mini-Game Hub</p><h1 id="heading">You’re offline</h1>
<p id="message">Reconnect to open the arcade. Your saved scores are on this device.</p>
<button id="retry" type="button">Try again</button></main>
<script>
let language = navigator.language;
try { language = localStorage.getItem("miniHubLocale_v1") || language; } catch {}
if (language.toLowerCase().startsWith("es")) {
  document.documentElement.lang = "es";
  document.getElementById("heading").textContent = "Sin conexión";
  document.getElementById("message").textContent = "Vuelve a conectarte para abrir los juegos. Tus resultados guardados siguen en este dispositivo.";
  document.getElementById("retry").textContent = "Reintentar";
}
document.getElementById("retry").addEventListener("click", () => location.reload());
</script></body></html>
